# Quadruped SkyWing test mob. Inherits the dragon basics (body, flight wing-arm, speech, diet) from
# WoFBaseMobDragon and replaces the sprite layers with the four-legged layout.

- type: entity
  save: false
  parent: WoFBaseMobDragon
  id: WoFMobSkyWing
  name: Urist McSkyWing
  components:
  - type: HumanoidAppearance
    species: SkyWing
  - type: Icon
    sprite: _WoF/Mobs/Species/SkyWing/parts.rsi
    state: full
  - type: Sprite
    layers:
    # Behind the body
    - map: [ "enum.HumanoidVisualLayers.Wings" ]
    - map: [ "enum.HumanoidVisualLayers.Tail" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    # Body
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
    - map: [ "enum.HumanoidVisualLayers.Underwear" ]
    - map: [ "enum.HumanoidVisualLayers.Undershirt" ]
    # In front of the body
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LFoot" ]
    - map: [ "enum.HumanoidVisualLayers.RFoot" ]
    - map: [ "enum.HumanoidVisualLayers.LHand" ]
    - map: [ "enum.HumanoidVisualLayers.RHand" ]
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]
    - map: [ "enum.HumanoidVisualLayers.Face" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
    # Worn items (they show human-shaped sprites until dragon versions are drawn)
    - map: [ "jumpsuit" ]
    - map: [ "gloves" ]
    - map: [ "shoes" ]
    - map: [ "ears" ]
    - map: [ "innerBelt" ]
    - map: [ "innerNeck" ]
    - map: [ "outerClothing" ]
    - map: [ "eyes" ]
    - map: [ "belt" ]
    - map: [ "id" ]
    - map: [ "neck" ]
    - map: [ "back" ]
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]
    - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: [ "clownedon" ]
      sprite: "Effects/creampie.rsi"
      state: "creampie_human"
      visible: false
  - type: Body
    prototype: WoFQuadrupedDragon
    requiredLegs: 2
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 220
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  # SkyWings are the fastest fliers: high top speed, quick acceleration, good glide.
  - type: MovementSpeedModifier
    weightlessAcceleration: 2.9
    weightlessModifier: 1.45
    weightlessFriction: 1.3
    weightlessFrictionNoInput: 0.3
  - type: Inventory
    speciesId: skywing
    templateId: wofdragon

