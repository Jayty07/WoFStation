# What a four-legged dragon can wear: no jumpsuits, shoes, gloves or suits.
# Pockets and the signet (ID) slot don't need a jumpsuit, unlike humans.

- type: inventoryTemplate
  id: wofdragon
  slots:
    - name: head
      slotTexture: head
      slotFlags: HEAD
      uiWindowPos: 1,2
      strippingWindowPos: 1,0
      displayName: Head
    - name: neck
      slotTexture: neck
      slotFlags: NECK
      uiWindowPos: 0,1
      strippingWindowPos: 0,1
      displayName: Neck
    - name: back
      slotTexture: back
      fullTextureName: template_small
      slotFlags: BACK
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 3,0
      strippingWindowPos: 0,2
      displayName: Saddlebag
    - name: belt
      slotTexture: belt
      fullTextureName: template_small
      slotFlags: BELT
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 3,1
      strippingWindowPos: 1,2
      displayName: Harness
    - name: id
      slotTexture: id
      fullTextureName: template_small
      slotFlags: IDCARD
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 2,1
      strippingWindowPos: 2,2
      displayName: Signet
    - name: pocket1
      slotTexture: pocket
      fullTextureName: template_small
      slotFlags: POCKET
      slotGroup: MainHotbar
      stripTime: 3
      uiWindowPos: 0,3
      strippingWindowPos: 0,3
      displayName: Pouch 1
      stripHidden: true
    - name: pocket2
      slotTexture: pocket
      fullTextureName: template_small
      slotFlags: POCKET
      slotGroup: MainHotbar
      stripTime: 3
      uiWindowPos: 2,3
      strippingWindowPos: 1,3
      displayName: Pouch 2
      stripHidden: true
