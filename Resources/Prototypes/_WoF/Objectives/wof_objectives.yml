# Objectives for the kingdom antagonists. These don't use the traitor objectives because those require
# the Traitor role. Steal targets reuse station items as placeholders for kingdom treasures:
#   Captain's ID card -> the Queen's signet, stamps -> royal seals, gold medal -> royal treasure.

# --- Bases ---

- type: entity
  abstract: true
  parent: BaseObjective
  id: WoFBaseUsurperObjective
  components:
  - type: Objective
    difficulty: 1
    issuer: wof-objective-issuer-usurper

- type: entity
  abstract: true
  parent: BaseObjective
  id: WoFBaseAssassinObjective
  components:
  - type: Objective
    difficulty: 1
    issuer: wof-objective-issuer-assassin

- type: entity
  abstract: true
  parent: BaseObjective
  id: WoFBaseSmugglerObjective
  components:
  - type: Objective
    difficulty: 1
    issuer: wof-objective-issuer-smuggler

# --- Royal Usurper ---

- type: entity
  parent: [WoFBaseUsurperObjective, BaseKillObjective]
  id: WoFKillQueenObjective
  description: The throne can't be yours while she breathes. Make sure she doesn't survive the day.
  components:
  - type: Objective
    difficulty: 3
    unique: true
    icon:
      sprite: Clothing/Head/Misc/fancycrown.rsi
      state: icon
  - type: TargetObjective
    title: wof-objective-kill-queen-title
  - type: WoFPickJobTarget
    jobs:
    - WoFQueen
  - type: KillPersonCondition
    requireDead: true

- type: entity
  parent: [WoFBaseUsurperObjective, BaseStealObjective]
  id: WoFStealSignetObjective
  components:
  - type: Objective
    difficulty: 2
  - type: StealCondition
    stealGroup: CaptainIDCard
    verifyMapExistence: true
  - type: NotJobRequirement
    job: WoFQueen

- type: entity
  parent: [WoFBaseUsurperObjective, BaseSurviveObjective]
  id: WoFUsurperSurviveObjective
  name: Live to wear the crown
  description: A dead usurper rules nothing. Survive until the end of the day.
  components:
  - type: Objective
    icon:
      sprite: Clothing/Head/Misc/fancycrown.rsi
      state: icon

# --- Infiltrating Assassin ---

- type: entity
  parent: [WoFBaseAssassinObjective, BaseKillObjective]
  id: WoFAssassinKillObjective
  description: Your client paid in advance. Finish the job however you like.
  components:
  - type: Objective
    difficulty: 1.75
    unique: false
  - type: TargetObjective
    title: objective-condition-kill-person-title
  - type: PickRandomPerson

- type: entity
  parent: [WoFBaseAssassinObjective, BaseSurviveObjective]
  id: WoFAssassinSurviveObjective
  name: Slip away
  description: Don't get caught, and don't get killed. A dead assassin doesn't get paid.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Melee/combat_knife.rsi
      state: icon

# --- Syndicate Smuggler ---

- type: entity
  abstract: true
  parent: [WoFBaseSmugglerObjective, BaseStealObjective]
  id: WoFBaseSmugglerStealObjective
  components:
  - type: StealCondition
    verifyMapExistence: true
    checkStealAreas: true

- type: entity
  parent: WoFBaseSmugglerStealObjective
  id: WoFSmuggleSealsObjective
  components:
  - type: Objective
    difficulty: 1
  - type: StealCondition
    stealGroup: Stamp
    minCollectionSize: 2
    maxCollectionSize: 4

- type: entity
  parent: WoFBaseSmugglerStealObjective
  id: WoFSmuggleTreasureObjective
  components:
  - type: Objective
    difficulty: 1.5
  - type: StealCondition
    stealGroup: ClothingNeckGoldmedal

- type: entity
  parent: WoFBaseSmugglerStealObjective
  id: WoFSmuggleMedicineObjective
  components:
  - type: Objective
    difficulty: 1.5
  - type: StealCondition
    stealGroup: Hypospray

- type: entity
  parent: WoFBaseSmugglerStealObjective
  id: WoFSmuggleCloaksObjective
  components:
  - type: Objective
    difficulty: 1.5
  - type: StealCondition
    stealGroup: HeadCloak
    minCollectionSize: 2
    maxCollectionSize: 4

- type: weightedRandom
  id: WoFSmugglerObjectiveGroups
  weights:
    WoFSmugglerObjectiveGroupSteal: 1

- type: weightedRandom
  id: WoFSmugglerObjectiveGroupSteal
  weights:
    WoFSmuggleSealsObjective: 1
    WoFSmuggleTreasureObjective: 1
    WoFSmuggleMedicineObjective: 1
    WoFSmuggleCloaksObjective: 1
